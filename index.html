<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zep Interactive</title>
<style>
  :root{--ink:#0d1330;--muted:#4a5275;--cab:#ffc629;--bg:#f6f7fb;--card:#fff;--line:#e3e6ef}
  @media (prefers-color-scheme: dark){:root{--ink:#eef0f8;--muted:#a9b0cc;--bg:#0d1330;--card:#151c40;--line:#263064}}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:760px;margin:0 auto;padding:40px 16px 64px}
  h1{font-size:34px;margin:0}
  .sub{color:var(--muted);margin:4px 0 32px}
  .game{display:flex;gap:18px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .game img{width:88px;height:88px;border-radius:20px;flex-shrink:0}
  .game h2{margin:0;font-size:22px}
  .game p{margin:4px 0 8px;color:var(--muted)}
  a{color:inherit}
</style>
</head>
<body>
<main>
<h1>Zep Interactive</h1>
<p class="sub">Small games for phones.</p>
<div class="game">
  <img src="heli-taxi-icon.png" alt="Heli Taxi icon">
  <div>
    <h2>Heli Taxi</h2>
    <p>Fly a helicopter taxi over an endless city. Pick up fares, land, get paid!</p>
    <a href="https://play.google.com/store/apps/details?id=com.zepinteractive.helitaxi">Google Play</a> ·
    <a href="privacy.html">Privacy Policy</a>
  </div>
</div>
<p class="sub" style="margin-top:32px">Contact: <a href="mailto:zepinteractive@gmail.com">zepinteractive@gmail.com</a></p>
</main>
</body>
</html>
